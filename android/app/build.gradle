plugins {
    id "com.android.application"
}

android {
    namespace "app.qiheng.android"
    compileSdk 34

    defaultConfig {
        applicationId "app.qiheng.android"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.0.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/qiheng-release.keystore")
            storePassword "qiheng-demo"
            keyAlias "qiheng"
            keyPassword "qiheng-demo"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
